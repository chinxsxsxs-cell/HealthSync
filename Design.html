<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealthSync | Laboratory Information System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .active-tab { background-color: #166534; border-left: 4px solid #4ade80; }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-gray-100 font-sans">

    <div id="login-screen" class="fixed inset-0 bg-green-900 flex items-center justify-center z-50">
        <div class="bg-white p-8 rounded-lg shadow-2xl w-96">
            <h1 class="text-3xl font-bold text-green-700 text-center mb-6">HealthSync</h1>
            <input type="text" id="login-id" placeholder="Unique ID" class="w-full p-2 border rounded mb-4">
            <input type="password" id="login-pass" placeholder="Password" class="w-full p-2 border rounded mb-4">
            <button onclick="handleLogin()" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700">Login</button>
        </div>
    </div>

    <div class="flex h-screen">
        <nav class="w-64 bg-green-800 text-white flex flex-col">
            <div class="p-6 text-2xl font-bold border-b border-green-700">HealthSync</div>
            <div class="flex-1 overflow-y-auto">
                <button onclick="showTab('dashboard')" class="w-full text-left p-4 hover:bg-green-700">Dashboard</button>
                <button onclick="showTab('registration')" class="w-full text-left p-4 hover:bg-green-700">Patient Registration</button>
                <button onclick="showTab('patient-list')" class="w-full text-left p-4 hover:bg-green-700">Patient Search/List</button>
                <button onclick="showTab('lab-entry')" class="w-full text-left p-4 hover:bg-green-700">Result Encoding</button>
                <button onclick="showTab('appointments')" class="w-full text-left p-4 hover:bg-green-700">Appointments</button>
            </div>
            <button onclick="logout()" class="p-4 bg-red-800 hover:bg-red-700">Logout</button>
        </nav>

        <main class="flex-1 p-8 overflow-y-auto">
            
            <section id="tab-registration" class="hidden">
                <h2 class="text-2xl font-bold text-green-800 mb-6">Patient Registration</h2>
                <form id="reg-form" class="grid grid-cols-2 gap-4 bg-white p-6 rounded shadow">
                    <input type="text" id="reg-name" placeholder="Full Name" class="border p-2 rounded" required>
                    <input type="date" id="reg-dob" class="border p-2 rounded" required>
                    <select id="reg-gender" class="border p-2 rounded">
                        <option>Male</option><option>Female</option><option>Other</option>
                    </select>
                    <input type="text" id="reg-civil" placeholder="Civil Status" class="border p-2 rounded">
                    <input type="text" id="reg-nation" placeholder="Nationality" class="border p-2 rounded">
                    <input type="text" id="reg-blood" placeholder="Blood Type" class="border p-2 rounded">
                    <input type="text" id="reg-address" placeholder="Permanent Address" class="border p-2 rounded col-span-2">
                    <input type="text" id="reg-phone" placeholder="Phone Number" class="border p-2 rounded">
                    <input type="email" id="reg-email" placeholder="Email Address" class="border p-2 rounded">
                    <input type="text" id="reg-pid" placeholder="Patient ID (Unique)" class="border p-2 rounded">
                    <input type="text" id="reg-gov" placeholder="Government ID" class="border p-2 rounded">
                    <input type="text" id="reg-phil" placeholder="PhilHealth Number" class="border p-2 rounded">
                    <input type="text" id="reg-allergies" placeholder="Allergies (comma separated)" class="border p-2 rounded col-span-2">
                    <input type="text" id="reg-emergency" placeholder="Emergency Contact Info" class="border p-2 rounded col-span-2">
                    
                    <h3 class="col-span-2 font-bold border-t pt-4">Admission Details</h3>
                    <select id="reg-source" class="border p-2 rounded">
                        <option>OPD</option><option>In-patient</option><option>Emergency</option>
                    </select>
                    <input type="text" id="reg-physician" placeholder="Attending Physician" class="border p-2 rounded">
                    <button type="button" onclick="savePatient()" class="col-span-2 bg-green-600 text-white py-2 rounded">Register Patient</button>
                </form>
            </section>

            <section id="tab-lab-entry" class="hidden">
                <h2 class="text-2xl font-bold text-green-800 mb-6">Result Encoding (Laboratory)</h2>
                <div class="bg-white p-6 rounded shadow mb-6">
                    <input type="text" id="lab-search-id" placeholder="Enter Patient ID" class="border p-2 rounded w-1/2">
                    <button onclick="loadLabPatient()" class="bg-blue-600 text-white px-4 py-2 rounded ml-2">Load Patient</button>
                </div>
                <div id="lab-form-container" class="hidden bg-white p-6 rounded shadow">
                    <h3 id="lab-patient-display" class="text-lg font-bold mb-4"></h3>
                    <table class="w-full border-collapse border">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="border p-2">Analyte</th>
                                <th class="border p-2">Result</th>
                                <th class="border p-2">Reference Range</th>
                                <th class="border p-2">Interpretation</th>
                            </tr>
                        </thead>
                        <tbody id="analyte-rows">
                            </tbody>
                    </table>
                    <div class="mt-4">
                        <label class="block font-bold">Diagnosis/Notes:</label>
                        <textarea id="lab-diagnosis" class="w-full border p-2 rounded h-24"></textarea>
                    </div>
                    <div class="mt-4">
                        <label class="block font-bold">Prescription:</label>
                        <textarea id="lab-prescription" class="w-full border p-2 rounded h-24"></textarea>
                    </div>
                    <button onclick="saveResults()" class="mt-4 bg-green-700 text-white px-6 py-2 rounded">Save & Generate PDF</button>
                </div>
            </section>

            <section id="tab-patient-list" class="hidden">
                <h2 class="text-2xl font-bold text-green-800 mb-6">Patient Database</h2>
                <div id="list-container" class="bg-white rounded shadow overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-green-100">
                            <tr>
                                <th class="p-3 text-left">ID</th>
                                <th class="p-3 text-left">Name</th>
                                <th class="p-3 text-left">Type</th>
                                <th class="p-3 text-left">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="patient-table-body"></tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
